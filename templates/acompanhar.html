{% extends "base.html" %}
{% block title %}Acompanhar cotacao — AMG Logistica{% endblock %}

{% block content %}
<div class="form-shell form-shell--narrow">
  <h1>Acompanhar cotacao</h1>
  <p class="lead">Informe o numero da cotacao e o e-mail usado na solicitacao.</p>

  {% if error %}<p class="notice notice--error">{{ error }}</p>{% endif %}

  <form method="post" action="/acompanhar" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="f_code">Numero da cotacao <span class="req">*</span></label>
      <input id="f_code" name="code" required placeholder="COT-2025-000123" value="{{ code or '' }}">
    </div>
    <div class="field">
      <label for="f_email">E-mail <span class="req">*</span></label>
      <input id="f_email" name="email" type="email" required value="{{ email or '' }}">
    </div>
    <button type="submit" class="btn btn--primary">Consultar</button>
  </form>
</div>
{% endblock %}
