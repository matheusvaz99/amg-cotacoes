{% extends "base.html" %}
{% block title %}Minhas cotações — AMG Logística{% endblock %}

{% block content %}
<div class="form-shell form-shell--narrow">
  <h1>Minhas cotações</h1>
  <p class="lead">Informe o e-mail usado nas solicitações para ver todas as suas cotações.</p>

  {% if error %}<p class="notice notice--error">{{ error }}</p>{% endif %}

  <form method="post" action="/acompanhar" class="card">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="field">
      <label for="f_email">E-mail <span class="req">*</span></label>
      <input id="f_email" name="email" type="email" required autocomplete="email" value="{{ email or '' }}">
    </div>
    <button type="submit" class="btn btn--primary">Consultar minhas cotações</button>
  </form>
</div>
{% endblock %}
