{% extends "base.html" %}
{% block title %}Painel comercial — AMG Logistica{% endblock %}
{% block body_class %}admin-login{% endblock %}

{% block content %}
<div class="form-shell form-shell--narrow">
  <div class="card">
    <h1>Painel comercial</h1>
    <p class="lead">Acesso restrito ao time da AMG.</p>
    {% if error %}<p class="notice notice--error">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="f_user">E-mail</label>
        <input id="f_user" name="username" type="email" required autocomplete="username" value="{{ username or '' }}">
      </div>
      <div class="field">
        <label for="f_pass">Senha</label>
        <input id="f_pass" name="password" type="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--primary btn--block">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
